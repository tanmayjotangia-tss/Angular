<div>
  <h1>Template Driven Forms</h1>
  <form (ngSubmit)="onSubmit(myForm)" #myForm="ngForm">
    <label for="name" >Name:</label>
    <input type="text" name="name" ngModel placeholder="Enter your name">
    <br>
    <br>
    <label for="email">Email:</label>
    <input type="email" name="email" ngModel placeholder="Enter your email">
    <br>
    <br>
    <label for="country">Country</label>
    <select id="country" name="country" ngModel>
      <option value="">Select a country</option>
      <option value="us">United States</option>
      <option value="ca">Canada</option>
      <option value="uk">United Kingdom</option>
    </select>
    <br>
    <br>
      <label>Gender:</label>
      <div *ngFor="let gender of genders; let i = index">
        <input 
          type="radio"
          [id]="'gender-' + i"
          name="gender"
          [value]="gender"
          [(ngModel)]="genderSelected"
        >
        <label [for]="'gender-' + i">{{ gender }}</label>
      </div>
    <br>
    <br>
    <label for="hobbies">Hobbies:</label>
    <input type="checkbox" name="hobbies" ngModel value="Reading"> Reading
    <input type="checkbox" name="hobbies" ngModel value="Traveling"> Traveling
    <input type="checkbox" name="hobbies" ngModel value="Cooking"> Cooking
    <input type="checkbox" name="hobbies" ngModel value="Sports"> Sports
    <br>
    <br>
    <button type="submit" >Submit</button>
  </form>
</div>
